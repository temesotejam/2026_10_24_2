name: Validate and deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: node --test scripts/combat-policy.test.mjs
      - run: npm test
      - run: npm run build:pages
      - name: Browser checks under the project subdirectory
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort --base /2026_10_24_2/ > /tmp/voxel-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/2026_10_24_2/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/voxel-preview.log
            exit 1
          fi
          node scripts/video-check.mjs --url http://127.0.0.1:4173/2026_10_24_2/watch/
          node scripts/visual-check.mjs --url http://127.0.0.1:4173/2026_10_24_2/
          node scripts/survival-check.mjs --url http://127.0.0.1:4173/2026_10_24_2/
          node scripts/polish-check.mjs --url http://127.0.0.1:4173/2026_10_24_2/
          node scripts/combat-check.mjs --url http://127.0.0.1:4173/2026_10_24_2/
          node scripts/adventure-check.mjs --url http://127.0.0.1:4173/2026_10_24_2/
          node scripts/journey-check.mjs --url http://127.0.0.1:4173/2026_10_24_2/
          node scripts/load-check.mjs --url http://127.0.0.1:4173/2026_10_24_2/
          node scripts/explore-check.mjs --url http://127.0.0.1:4173/2026_10_24_2/ --distance 32
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: visual-check/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  published-checks:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the deployed site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          node scripts/video-check.mjs --url "${site_url%/}/watch/"
          node scripts/visual-check.mjs --url "$site_url"
          node scripts/survival-check.mjs --url "$site_url"
          node scripts/polish-check.mjs --url "$site_url"
          node scripts/adventure-check.mjs --url "$site_url"
          node scripts/combat-check.mjs --url "$site_url"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-browser-checks
          path: visual-check/
