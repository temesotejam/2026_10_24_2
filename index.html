<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#87ceeb" />
    <meta
      name="description"
      content="A Minecraft-inspired voxel world in the browser: infinite procedural terrain, break and place blocks, no install."
    />
    <title>Classic Voxel Survival</title>
  </head>
  <body>
    <div id="app">
      <div id="crosshair" aria-hidden="true"></div>
      <div id="hotbar"></div>
      <div id="overlay">
        <div id="overlay-content">
          <h1>Classic Voxel Survival</h1>
          <p class="controls-desktop">
            WASD：移動 &middot; マウス：視点 &middot; Space：ジャンプ<br />
            左クリック：採掘 &middot; 右クリック：設置 &middot; Ctrl：ダッシュ &middot;
            Shift：しゃがみ<br />
            1〜9 / ホイール：ブロック選択 &middot; Esc：操作解除
          </p>
          <p class="controls-touch">
            左側：移動 &middot; 右側ドラッグ：視点<br />
            タップ：採掘 &middot; ボタン：ジャンプ・設置<br />
            スロットをタップ：ブロック選択
          </p>
          <button id="play-button" type="button">プレイする</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
